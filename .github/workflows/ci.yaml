name: ci
on:
  pull_request:
    branches:
      - "main"
  push:
    branches:
      - "main"
    tags:
      - "v*"
jobs:
  linux_amd64:
    uses: ./.github/workflows/build-linux.yaml
    with:
      upload-artifact: ${{ startsWith(github.ref, 'refs/tags/') }}
      GOARCH: amd64
      runs-on: ubuntu-26.04
    secrets: inherit
  linux_arm64:
    uses: ./.github/workflows/build-linux.yaml
    with:
      upload-artifact: ${{ startsWith(github.ref, 'refs/tags/') }}
      GOARCH: arm64
      runs-on: ubuntu-26.04-arm
    secrets: inherit
  release:
    concurrency: release
    runs-on: ubuntu-26.04
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    needs:
      - linux_amd64
      - linux_arm64
    steps:
      - name: Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            ${{ needs.linux_amd64.outputs.artifact }}
            ${{ needs.linux_arm64.outputs.artifact }}
      - name: Add to pkg.go.dev
        # https://pkg.go.dev/about#adding-a-package
        run: |
          set -e
          curl -v https://proxy.golang.org/github.com/fornellas/rrb/@v/$(git describe --tags).info
        shell: bash
  coveralls:
    needs:
      - linux_amd64
      - linux_arm64
    runs-on: ubuntu-26.04
    steps:
      - name: Coveralls Finished
        uses: coverallsapp/github-action@v2
        with:
          parallel-finished: true
